name: Build RippleReborn.exe
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract (gets bundled into the exe)
        run: choco install tesseract -y --no-progress
      - name: Build
        shell: pwsh
        run: |
          pip install -r requirements.txt
          New-Item -ItemType Directory tess | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\*" tess -Recurse
          Get-ChildItem tess\tessdata -File | Where-Object { $_.Name -notin 'eng.traineddata','osd.traineddata' } | Remove-Item
          pyinstaller --onefile --noconsole --name RippleReborn --icon logo.ico --add-data "logo.png;." --add-data "logo.ico;." --add-data "tess;tesseract" ripple_reborn.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Ripple Reborn v1.0 (build ${{ github.run_number }})
          files: dist/RippleReborn.exe
